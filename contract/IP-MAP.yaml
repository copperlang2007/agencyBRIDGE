project: agencybridge
scan_status: bounded-with-evidence
scan_note: >-
  IP-FIRST requires searching the complete owned portfolio. The registry lists 88
  repositories; this session had read access to agencyBRIDGE plus repositories it
  attached explicitly. One targeted scan was performed against the single highest-
  signal candidate for the capability actually touched (commission short-pay
  logic). The remaining portfolio is UNSCANNED and this is a known gap, not a
  claim of coverage.
rules:
  - inspect owned IP before building new capability
  - record exact repository and path for reusable assets
  - justify every deliberate rebuild
scanned:
