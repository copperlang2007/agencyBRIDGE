next_action:
  id: OPS-001
  description: >-
    Set DATABASE_URL in the Vercel project's environment variables (R-012). It
    cannot be set from the build environment, and until it is the API answers
    503 not_configured on every request. Then run `npm run db:migrate` and
    `npm run db:seed` against that database, and — only if real accounts are
    wanted — re-run the seed with SEED_ADMIN_EMAIL and SEED_ADMIN_PASSWORD set
    to credentials the operator chooses. No real credential is generated,
    printed, or stored by this repository.
